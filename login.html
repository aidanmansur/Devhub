<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevHub - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-icon">
                    &lt;/&gt;
                </span>

                Dev<span>Hub</span>

            </a>


            <div class="auth-heading">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Login to your DevHub account.
                </p>

            </div>


            <form
                id="loginForm"
                novalidate
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="you@example.com"
                    >

                    <small
                        id="loginEmailError"
                        class="error-message"
                    ></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                    >

                    <small
                        id="loginPasswordError"
                        class="error-message"
                    ></small>

                </div>


                <!-- Login button -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Login
                </button>


                <!-- Error -->

                <div
                    id="loginError"
                    class="error-message"
                ></div>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
